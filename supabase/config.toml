# Planit Data Library — Supabase Project Configuration

project_id = "planit-data-library"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["https://localhost:8080"]
jwt_expiry = 3600
enable_signup = true

[functions.ai-assistant]
verify_jwt = true

[functions.public-share]
verify_jwt = false

[functions.governance-cron]
verify_jwt = true
